[project]
authors = [{name = "David Wright", email = "dcw3.dev@gmail.com"}]
dependencies = [
    "jax>=0.4.20",
    "numpyro>=0.13.0",
    # Not imported directly; needed to load the saved flow.pkl files (bounds match coppuccino).
    "equinox>=0.13.2,<0.14",
    "flowjax>=17.2.1,<18",
    "numpy>1.23.1",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "cyclopts>=2.0.0",
    "tqdm>=4.65.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.1.1",
    "zarr>=3",
    "arviz>=1",
    "anesthetic>=2.14.4,<3",
    "harmonic>=1.3.1",
    "corner>=2.3.0,<3",
]
name = "flows-model-comparison"
requires-python = ">=3.12,<3.15"
version = "0.1.0"

[project.optional-dependencies]
dev = ["black", "ruff"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
flows_model_comparison = { path = ".", editable = true }
# Keep the discovery rev in sync with DISCOVERY_REV in scripts/fetch_data.py.
discovery = { git = "https://github.com/nanograv/discovery", rev = "b26d2554df5540a7610eedf926659701daad01ad" }
coppuccino = { git = "https://github.com/AaronDJohnson/coppuccino", rev = "6feb09feaa48d805112508756dfa081cfb584c34" }
# Pinned to a revision compatible with jax<0.8 (matches coppuccino's pin and
# the saved flow.pkl files in outputs/flows/posterior/). Newer revisions of
# handley-lab/blackjax require jax>=0.9, which would invalidate those pickles.
# Upstream blackjax has nested sampling from 1.6 on (same nss/finalise API), but
# every 1.6.x requires jax>=0.9, which conflicts with coppuccino's jax<0.8 pin.
blackjax = { git = "https://github.com/handley-lab/blackjax", rev = "7950586711bc3befef271050857d8bddb4571807" }

[tool.pixi.tasks]
fetch-data = "python scripts/fetch_data.py"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
gpu = ["gpu"]

[tool.pixi.dependencies]
# harmonic pins setuptools==68.0.0.
setuptools = "==68"

# Interactive tooling only; kept out of the gpu (cluster) environment.
[tool.pixi.feature.dev.dependencies]
ipdb = ">=0.13.13,<0.14"
jupyterlab = ">=4.5.7,<5"
jupytext = ">=1.19.3,<2"
nodejs = ">=26.5.0,<26.6"
jupyter-ai = ">=3.0.1,<4"

[tool.pixi.feature.dev.pypi-dependencies]
jupyterlab-vim = ">=4.1.4,<5"
jupyterlab-lsp = ">=5.3.0,<6"

[dependency-groups]
gpu = ["jax[cuda]"]


[tool.ty.environment]
python = ".pixi/envs/default"
